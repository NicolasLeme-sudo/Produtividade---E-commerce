<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Panorama">
<meta name="theme-color" content="#0F1623">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="/logo-mark.png">
<title>Panorama</title>
<link rel="icon" href="/logo-mark.png" type="image/png">
<!--
  PANORAMA — leitura da operação no celular, com valor em R$.
  - Mesma fonte do telão: snapshot "operacao" (dados->resumo), gravado pelo ingest.js a cada rodada do
    robô (30 min). Nenhuma conta de regra aqui: a página só formata o que o ingest já calculou.
  - Forecast vem do banco do Report (RPC produtividade_forecast), abastecido pela Curva de Faturamento.
  - Duas abas, cada uma com o mesmo toggle Itens / R$:
      Operação    = o que está parado no CD agora, por etapa, marca e idade.
      Plano x Real = faturado do dia contra o forecast, backlog e acumulado do mês.
  - Sem Corrida Maluca, sem comemoração, sem hora de ouro e SEM NOME DE COLABORADOR.
  - Só lê: nunca grava nada no banco.
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0F1623; --bg-card:#192032; --bg-soft:#1E2A3D; --border:#253048;
  --text:#E8EBF2; --muted:#7C8BA8; --label:#9BAAC4;
  --azul:#297ADF; --azul-cl:#7FB2EC; --turq:#2EC4B6; --amar:#F6BD00;
  --verde:#45C645; --laranja:#F5A524; --verm:#E0334F;
  --mz:#DFBD41; --oly:#297ADF; --ua:#C8102E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-variant-numeric:tabular-nums;font-size:16px;line-height:1.35;
  -webkit-text-size-adjust:100%}
body{padding:0 0 env(safe-area-inset-bottom)}

/* ---------- topo fixo: abas + toggle ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(15,22,35,.96);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);padding:calc(8px + env(safe-area-inset-top)) 12px 0}
.linha1{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:30px}
.marca{font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.selo{display:flex;align-items:center;gap:5px;font-size:.68rem;color:var(--muted);white-space:nowrap}
.selo i{width:7px;height:7px;border-radius:50%;background:var(--verde);flex:none}
.selo.amb i{background:var(--amar)} .selo.vrm i{background:var(--verm)}
.linha2{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.abas{display:flex;gap:2px}
.aba{appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
  font:inherit;font-size:.9rem;font-weight:700;padding:9px 11px 8px;cursor:pointer}
.aba.on{color:var(--text);border-bottom-color:var(--azul)}
.tgl{display:flex;background:var(--bg-soft);border:1px solid var(--border);border-radius:999px;padding:2px;margin-bottom:6px}
.tgl button{appearance:none;background:none;border:0;color:var(--muted);font:inherit;font-size:.74rem;
  font-weight:800;padding:5px 12px;border-radius:999px;cursor:pointer;letter-spacing:.02em}
.tgl button.on{background:var(--azul);color:#fff}

main{padding:14px 12px 28px;max-width:720px;margin:0 auto}
.tela{display:none} .tela.on{display:block}

/* ---------- blocos ---------- */
section{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
h2{margin:0 0 11px;font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--label)}
.destaque{text-align:center;padding:18px 14px 16px}
.destaque .n{font-size:2.6rem;font-weight:800;line-height:1.05;letter-spacing:-.02em}
.destaque .sub{margin-top:5px;font-size:.84rem;color:var(--muted)}
.destaque .ctx{margin-top:9px;padding-top:9px;border-top:1px solid var(--border);font-size:.76rem;color:var(--muted)}
.destaque .ctx b{color:var(--text)}

/* ---------- lista etapa / marca ---------- */
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--border)}
.item:last-child{border-bottom:0;padding-bottom:0}
.item .nm{font-size:.88rem;font-weight:600;min-width:0}
.item .vl{font-size:.95rem;font-weight:800;text-align:right;white-space:nowrap}
.item .sb{font-size:.72rem;color:var(--muted)}
.item .sb2{font-size:.72rem;color:var(--muted);text-align:right;white-space:nowrap}
.barra{grid-column:1/-1;height:4px;border-radius:3px;background:var(--bg-soft);overflow:hidden;margin-top:5px}
.barra i{display:block;height:100%;border-radius:3px;background:var(--azul)}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:11px;padding-top:11px;
  border-top:2px solid var(--border);font-weight:800}
.tot span{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--label)}
.tot b{font-size:1.1rem}

/* ---------- plano x real ---------- */
.pxr{margin-bottom:16px}
.pxr:last-child{margin-bottom:0}
.pxr .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:7px}
.pxr .ttl{font-size:.88rem;font-weight:700}
.pxr .pct{font-size:1.05rem;font-weight:800}
.trilho{position:relative;height:26px;border-radius:7px;background:var(--bg-soft);overflow:hidden}
.trilho i{display:block;height:100%;border-radius:7px 0 0 7px;background:var(--azul);transition:width .5s}
.trilho .meta{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);opacity:.55}
.pxr .leg{display:flex;justify-content:space-between;margin-top:6px;font-size:.74rem;color:var(--muted)}
.pxr .leg b{color:var(--text)}
.ok{color:var(--verde)} .atencao{color:var(--amar)} .ruim{color:var(--verm)}
.trilho i.ok{background:var(--verde)} .trilho i.atencao{background:var(--amar)} .trilho i.ruim{background:var(--verm)}

/* ---------- tabela compacta ---------- */
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{font-size:.64rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;
  text-align:right;padding:0 0 7px}
th:first-child{text-align:left}
td{padding:8px 0;border-top:1px solid var(--border);text-align:right;white-space:nowrap}
td:first-child{text-align:left;white-space:normal}
td.v{font-weight:800}
tr.total td{border-top:2px solid var(--border);font-weight:800}

.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
.vazio{color:var(--muted);font-size:.82rem;text-align:center;padding:18px 8px}
.rodape{text-align:center;font-size:.68rem;color:var(--muted);padding:4px 0 10px}

/* ---------- login ---------- */
#login{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px;z-index:50}
#login.on{display:flex}
#login form{width:100%;max-width:320px}
#login h1{font-size:1.1rem;margin:0 0 4px}
#login p{margin:0 0 18px;color:var(--muted);font-size:.82rem}
#login input{width:100%;padding:12px 13px;margin-bottom:10px;background:var(--bg-soft);color:var(--text);
  border:1px solid var(--border);border-radius:10px;font:inherit;font-size:1rem}
#login button{width:100%;padding:12px;background:var(--azul);color:#fff;border:0;border-radius:10px;
  font:inherit;font-weight:800;font-size:1rem;cursor:pointer}
#loginErro{color:var(--verm);font-size:.8rem;min-height:1.2em;margin:8px 0 0}
</style>
</head>
<body>

<div id="login">
  <form id="loginForm">
    <h1>Panorama</h1>
    <p>Entre com o seu acesso do Produtividade.</p>
    <input id="loginEmail" type="text" placeholder="usuário ou e-mail" autocomplete="username" autocapitalize="off" autocorrect="off">
    <input id="loginSenha" type="password" placeholder="senha" autocomplete="current-password">
    <button type="submit">Entrar</button>
    <p id="loginErro"></p>
  </form>
</div>

<header>
  <div class="linha1">
    <div class="marca">Panorama</div>
    <div class="selo" id="selo"><i></i><span id="seloTxt">—</span></div>
  </div>
  <div class="linha2">
    <div class="abas">
      <button class="aba on" data-tela="op">Operação</button>
      <button class="aba" data-tela="pxr">Plano × Real</button>
    </div>
    <div class="tgl">
      <button id="btItens" class="on">Itens</button>
      <button id="btRs">R$</button>
    </div>
  </div>
</header>

<main>
  <div class="tela on" id="tela-op"></div>
  <div class="tela" id="tela-pxr"></div>
  <div class="rodape" id="rodape"></div>
</main>

<script>
(function(){
'use strict';

/* ================= ligação ================= */
var SUPABASE_URL = 'https://vehfchdfbukrbcedciiy.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZlaGZjaGRmYnVrcmJjZWRjaWl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMDI5NjksImV4cCI6MjEwNTU3ODk2OX0.zuHswp3JIts2jeA_AOj7DIXo7no7Ql33BPNVX4oePL8';
var DOMINIO_LOGIN = '@vulcabras.com';
// storageKey próprio: entrar aqui não derruba a sessão do telão na TV, e vice-versa.
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY,
  { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'panorama-produtividade' } });

// Forecast: banco do Report E-commerce (outro projeto). Só a RPC de leitura é liberada.
var REPORT_URL = 'https://tawliuofpmfohylqdnix.supabase.co';
var REPORT_KEY = 'sb_publishable__a5cJ6yFJIMgf505C4v7vQ_igDbuv5k';
var sbReport = window.supabase.createClient(REPORT_URL, REPORT_KEY,
  { auth: { persistSession: false, autoRefreshToken: false, storageKey: 'panorama-report' } });

var REFRESH_S = 60;            // o dado só muda a cada rodada do robô (30 min); 60 s mantém o selo vivo
var MARCAS = ['Mizuno', 'Olympikus', 'Under Armour'];
var COR_MARCA = { 'Mizuno': 'var(--mz)', 'Olympikus': 'var(--oly)', 'Under Armour': 'var(--ua)' };

/* ================= estado ================= */
var emRs = false, telaAtual = 'op', dados = { resumo: null, forecast: null, erro: null };

/* ================= formatação ================= */
function n0(v){ return Math.round(v || 0).toLocaleString('pt-BR'); }
function brl(v){ return 'R$ ' + Math.round(v || 0).toLocaleString('pt-BR'); }
// Número curto para os cards grandes: 2,81 M · 885 K · 12.971.
// Só encurta acima de 100 mil: abaixo disso o número inteiro cabe e "13 K" esconderia a diferença
// entre 12.971 e 13.499, que é justamente o que se olha ao comparar com o forecast.
function curto(v){
  v = v || 0;
  if (Math.abs(v) >= 1e6) return (v / 1e6).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' M';
  if (Math.abs(v) >= 1e5) return Math.round(v / 1e3).toLocaleString('pt-BR') + ' K';
  return n0(v);
}
function peds(p){ return n0(p) + (p === 1 ? ' pedido' : ' pedidos'); }
function brlCurto(v){ return 'R$ ' + curto(v); }
// Valor na unidade do toggle
function val(itens, rs){ return emRs ? brl(rs) : n0(itens); }
function valCurto(itens, rs){ return emRs ? brlCurto(rs) : curto(itens); }
function un(){ return emRs ? 'R$' : 'itens'; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }
function hhmm(d){ return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function iso(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function ddmm(s){ var p = String(s).split('-'); return p[2] + '/' + p[1]; }
// Classe pela distância do plano: a partir de 95% está no alvo, abaixo de 70% é problema.
// "inverso" para o que é melhor quanto MENOR (backlog): aí ficar abaixo do previsto é que é bom.
function classePct(p, inverso){
  if (inverso) return p <= 100 ? 'ok' : p <= 130 ? 'atencao' : 'ruim';
  return p >= 95 ? 'ok' : p >= 70 ? 'atencao' : 'ruim';
}

/* ================= seções reutilizáveis ================= */
// Lista com barra proporcional (etapas, marcas, idade)
function lista(linhas, total){
  if (!linhas.length) return '<div class="vazio">Sem dados.</div>';
  var max = Math.max.apply(null, linhas.map(function(l){ return emRs ? l.rs : l.itens; })) || 1;
  return linhas.map(function(l){
    var v = emRs ? l.rs : l.itens, pct = Math.max(1, 100 * v / max);
    var fatia = total ? (100 * v / total) : null;
    return '<div class="item">' +
      '<div class="nm">' + (l.cor ? '<span class="dot" style="background:' + l.cor + '"></span>' : '') + esc(l.nome) + '</div>' +
      '<div class="vl">' + val(l.itens, l.rs) + '</div>' +
      '<div class="sb">' + esc(l.sub || '') + '</div>' +
      '<div class="sb2">' + (fatia != null ? fatia.toFixed(1) + '%' : '') + '</div>' +
      '<div class="barra"><i style="width:' + pct + '%' + (l.cor ? ';background:' + l.cor : '') + '"></i></div>' +
      '</div>';
  }).join('');
}
// Barra "realizado contra o previsto", com o traço do plano em 100%
function barraPlano(titulo, real, previsto, rotuloReal, rotuloPrev, inverso){
  if (!previsto) {
    return '<div class="pxr"><div class="top"><div class="ttl">' + esc(titulo) + '</div>' +
      '<div class="pct" style="color:var(--muted);font-size:.8rem">sem plano</div></div>' +
      '<div class="trilho"><i style="width:100%;background:var(--bg-soft)"></i></div>' +
      '<div class="leg"><span>Realizado <b>' + esc(rotuloReal) + '</b></span></div></div>';
  }
  var pct = 100 * real / previsto, cls = classePct(pct, inverso);
  // a barra enche até 100% do trilho; acima disso o traço do plano fica para trás
  var larg = Math.min(100, pct), posMeta = pct > 100 ? 100 * previsto / real : 100;
  return '<div class="pxr">' +
    '<div class="top"><div class="ttl">' + esc(titulo) + '</div><div class="pct ' + cls + '">' + pct.toFixed(0) + '%</div></div>' +
    '<div class="trilho"><i class="' + cls + '" style="width:' + larg + '%"></i>' +
      '<div class="meta" style="left:calc(' + posMeta + '% - 1px)"></div></div>' +
    '<div class="leg"><span>Realizado <b>' + esc(rotuloReal) + '</b></span>' +
      '<span>Plano <b>' + esc(rotuloPrev) + '</b></span></div></div>';
}

/* ================= aba 1: operação ================= */
function renderOperacao(){
  var r = dados.resumo, el = document.getElementById('tela-op');
  if (!r) { el.innerHTML = '<section><div class="vazio">' +
    esc(dados.erro || 'Aguardando o primeiro envio do Acompanhamento OP.') + '</div></section>'; return; }

  var h = '';

  // -- cartão principal
  h += '<section class="destaque">' +
    '<div class="n">' + (emRs ? brlCurto(r.rs) : n0(r.itens)) + '</div>' +
    '<div class="sub">' + (emRs ? 'em operação no CD' : 'itens em operação no CD') + '</div>' +
    '<div class="ctx"><b>' + n0(r.pedidos) + '</b> pedidos · ticket <b>' +
      brl(r.pedidos ? r.rs / r.pedidos : 0) + '</b>/pedido' +
      (r.itens ? ' · <b>' + brl(r.rs / r.itens) + '</b>/item' : '') + '</div>' +
    '</section>';

  // -- por etapa
  var etapas = (r.etapas || []).filter(function(e){ return e.itens || e.rs; }).map(function(e){
    return { nome: e.nome, itens: e.itens, rs: e.rs, sub: peds(e.pedidos) };
  });
  h += '<section><h2>Por etapa</h2>' + lista(etapas, emRs ? r.rs : r.itens) +
    '<div class="tot"><span>Total</span><b>' + val(r.itens, r.rs) + '</b></div></section>';

  // -- por marca: em R$ a fatia muda em relação a peças, e é isso que interessa aqui
  var marcas = MARCAS.concat(Object.keys(r.marcas || {}).filter(function(m){ return MARCAS.indexOf(m) < 0; }))
    .map(function(m){
      var it = (r.marcas || {})[m] || 0, rs = (r.marcasRs || {})[m] || 0;
      // o subtítulo mostra sempre a OUTRA unidade: é a comparação que revela a marca cara
      return { nome: m, itens: it, rs: rs, cor: COR_MARCA[m] || 'var(--muted)',
               sub: emRs ? n0(it) + ' itens' : brl(rs) };
    }).filter(function(m){ return m.itens || m.rs; })
    .sort(function(a, b){ return (emRs ? b.rs - a.rs : b.itens - a.itens); });
  h += '<section><h2>Por marca · fatia ' + (emRs ? 'do R$' : 'dos itens') + '</h2>' +
    lista(marcas, emRs ? r.rs : r.itens) + '</section>';

  // -- idade do pedido (dias úteis desde a importação)
  var idade = (r.idade || []).filter(function(f){ return f.itens || f.rs; }).map(function(f){
    return { nome: f.label, itens: f.itens, rs: f.rs, sub: peds(f.pedidos) };
  });
  if (idade.length) h += '<section><h2>Há quanto tempo no CD</h2>' + lista(idade, emRs ? r.rs : r.itens) + '</section>';

  // -- pontos de atenção
  var at = [];
  if (r.semConferir && (r.semConferir.itens || r.semConferir.rs))
    at.push({ nome: 'Separado sem conferir', itens: r.semConferir.itens, rs: r.semConferir.rs, sub: peds(r.semConferir.pedidos) });
  if (r.semColeta && (r.semColeta.itens || r.semColeta.rs))
    at.push({ nome: 'Conferido sem expedição', itens: r.semColeta.itens, rs: r.semColeta.rs, sub: peds(r.semColeta.pedidos) });
  if (at.length) {
    h += '<section><h2>Pontos de atenção</h2>' + lista(at, null);
    if (r.maisAntigoDias != null)
      h += '<div class="rodape" style="padding:10px 0 0;text-align:left">Pedido mais antigo em tela: <b>' +
        r.maisAntigoDias + (r.maisAntigoDias === 1 ? ' dia útil' : ' dias úteis') + '</b></div>';
    h += '</section>';
  }

  el.innerHTML = h;
}

/* ================= aba 2: plano × real ================= */
function renderPlano(){
  var r = dados.resumo, fc = dados.forecast, el = document.getElementById('tela-pxr');
  if (!r) { el.innerHTML = '<section><div class="vazio">' +
    esc(dados.erro || 'Aguardando o primeiro envio do Acompanhamento OP.') + '</div></section>'; return; }
  if (!fc) { el.innerHTML = '<section><div class="vazio">Forecast indisponível — não foi possível ler o Report E-commerce.</div></section>'; return; }

  var hoje = iso(new Date()), h = '';
  var fat = (r.faturado || {})[hoje] || null;      // faturado de hoje (Itens de NF, Data de Emissão)
  var prev = fc.dias[hoje] || null;

  // -- hoje: faturado contra o forecast
  h += '<section><h2>Hoje · ' + ddmm(hoje) + '</h2>';
  if (!fat) {
    h += '<div class="vazio">Nada faturado hoje ainda.</div>';
  } else {
    var real = emRs ? fat.rs : fat.itens;
    var plano = prev ? (emRs ? prev.TOTAL.rs : prev.TOTAL.itens) : 0;
    h += barraPlano('Faturado × forecast', real, plano, valCurto(fat.itens, fat.rs),
      prev ? valCurto(prev.TOTAL.itens, prev.TOTAL.rs) : '—');
    if (!emRs && prev && prev.CAPACITY)
      h += barraPlano('Faturado × capacidade', fat.itens, prev.CAPACITY.itens, curto(fat.itens), curto(prev.CAPACITY.itens));
    h += '<div class="rodape" style="padding:2px 0 0;text-align:left">' +
      '<b>' + n0(fat.notas) + '</b> notas emitidas · ticket <b>' + brl(fat.notas ? fat.rs / fat.notas : 0) + '</b></div>';
  }
  h += '</section>';

  // -- backlog: o que está parado agora contra a previsão do planejamento
  h += '<section><h2>Backlog</h2>';
  var backPrev = prev && prev.BACKLOG_PREVISTO ? prev.BACKLOG_PREVISTO.itens : 0;
  if (emRs) {
    // o planejamento só prevê backlog em itens; aqui o previsto vira R$ pelo ticket do forecast do dia
    var tk = prev && prev.TOTAL && prev.TOTAL.itens ? prev.TOTAL.rs / prev.TOTAL.itens : 0;
    var backPrevRs = backPrev * tk;
    h += barraPlano('Parado agora × previsto', r.rs, backPrevRs, brlCurto(r.rs), backPrevRs ? brlCurto(backPrevRs) : '—', true);
    if (tk) h += '<div class="rodape" style="padding:2px 0 0;text-align:left">' +
      'O plano prevê backlog só em itens: o R$ previsto usa o ticket do forecast de hoje (' + brl(tk) + '/item).</div>';
  } else {
    h += barraPlano('Parado agora × previsto', r.itens, backPrev, curto(r.itens), backPrev ? curto(backPrev) : '—', true);
    if (prev && prev.POSICAO_INICIAL)
      h += '<div class="rodape" style="padding:2px 0 0;text-align:left">Posição inicial prevista para hoje: <b>' +
        n0(prev.POSICAO_INICIAL.itens) + '</b> itens</div>';
  }
  h += '</section>';

  // -- por marca, previsto × realizado de hoje
  if (fat && prev) {
    var linhas = MARCAS.map(function(m){
      var rm = (fat.marcas || {})[m] || { itens: 0, rs: 0 }, pm = prev[m];
      var real = emRs ? rm.rs : rm.itens, plano = pm ? (emRs ? pm.rs : pm.itens) : 0;
      return { m: m, real: real, plano: plano, rm: rm, pm: pm };
    }).filter(function(x){ return x.real || x.plano; });
    if (linhas.length) {
      h += '<section><h2>Por marca · hoje</h2><table><thead><tr>' +
        '<th>Marca</th><th>Real</th><th>Plano</th><th>%</th></tr></thead><tbody>';
      linhas.forEach(function(x){
        var pct = x.plano ? 100 * x.real / x.plano : null;
        h += '<tr><td><span class="dot" style="background:' + COR_MARCA[x.m] + '"></span>' + esc(x.m) + '</td>' +
          '<td class="v">' + valCurto(x.rm.itens, x.rm.rs) + '</td>' +
          '<td>' + (x.pm ? valCurto(x.pm.itens, x.pm.rs) : '—') + '</td>' +
          '<td class="' + (pct == null ? '' : classePct(pct)) + '">' + (pct == null ? '—' : pct.toFixed(0) + '%') + '</td></tr>';
      });
      h += '</tbody></table></section>';
    }
  }

  // -- acumulado do mês: só os dias que o snapshot já guarda
  var mes = hoje.slice(0, 7), somaR = { itens: 0, rs: 0 }, somaP = { itens: 0, rs: 0 }, dias = [];
  Object.keys(r.faturado || {}).sort().forEach(function(d){
    if (d.slice(0, 7) !== mes || d > hoje) return;
    var f = r.faturado[d], p = fc.dias[d];
    somaR.itens += f.itens; somaR.rs += f.rs;
    if (p && p.TOTAL) { somaP.itens += p.TOTAL.itens; somaP.rs += p.TOTAL.rs; }
    dias.push({ d: d, f: f, p: p });
  });
  if (dias.length) {
    h += '<section><h2>Acumulado · ' + dias.length + (dias.length === 1 ? ' dia' : ' dias') + ' com dado</h2>';
    h += barraPlano('Faturado × forecast no período', emRs ? somaR.rs : somaR.itens, emRs ? somaP.rs : somaP.itens,
      valCurto(somaR.itens, somaR.rs), valCurto(somaP.itens, somaP.rs));
    h += '<table style="margin-top:12px"><thead><tr><th>Dia</th><th>Faturado</th><th>Plano</th><th>%</th></tr></thead><tbody>';
    dias.slice().reverse().forEach(function(x){
      var real = emRs ? x.f.rs : x.f.itens;
      var plano = x.p && x.p.TOTAL ? (emRs ? x.p.TOTAL.rs : x.p.TOTAL.itens) : 0;
      var pct = plano ? 100 * real / plano : null;
      h += '<tr><td>' + ddmm(x.d) + '</td>' +
        '<td class="v">' + valCurto(x.f.itens, x.f.rs) + '</td>' +
        '<td>' + (plano ? valCurto(x.p.TOTAL.itens, x.p.TOTAL.rs) : '—') + '</td>' +
        '<td class="' + (pct == null ? '' : classePct(pct)) + '">' + (pct == null ? '—' : pct.toFixed(0) + '%') + '</td></tr>';
    });
    h += '</tbody></table>';
    h += '<div class="rodape" style="padding:10px 0 0;text-align:left">O histórico começa no dia em que o valor passou ' +
      'a ser gravado: dias anteriores não aparecem.</div></section>';
  }

  el.innerHTML = h;
}

/* ================= selo de atualização ================= */
// Mesma regra do telão: vale a hora do relatório MAIS VELHO de que a tela depende.
function renderSelo(){
  var r = dados.resumo, el = document.getElementById('selo'), txt = document.getElementById('seloTxt');
  if (!r) { el.className = 'selo vrm'; txt.textContent = 'sem dados'; return; }
  var fontes = [r.opEm, r.nfEm].filter(Boolean);
  if (!fontes.length) { el.className = 'selo vrm'; txt.textContent = 'sem dados'; return; }
  var velho = new Date(Math.min.apply(null, fontes)), min = (Date.now() - velho) / 60000;
  el.className = 'selo' + (min > 120 ? ' vrm' : min > 60 ? ' amb' : '');
  txt.textContent = 'Dado de ' + hhmm(velho);
}

/* ================= busca ================= */
async function carregar(){
  try {
    var hoje = new Date(), de = new Date(hoje); de.setDate(1);
    var ate = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0);
    var r = await Promise.all([
      sb.from('dashboard_snapshots').select('resumo:dados->resumo').eq('pagina', 'operacao').maybeSingle(),
      sbReport.rpc('produtividade_forecast', { de: iso(de), ate: iso(ate) })
    ]);
    if (r[0].error) throw r[0].error;
    dados.resumo = (r[0].data || {}).resumo || null;
    dados.erro = null;

    // Forecast: { dias: { '2026-11-17': { TOTAL:{itens,rs}, CAPACITY:{...}, Mizuno:{...} } } }
    if (r[1].error) { console.error('Forecast indisponível', r[1].error); dados.forecast = null; }
    else {
      var dias = {};
      (r[1].data || []).forEach(function(l){
        (dias[l.data] || (dias[l.data] = {}))[l.marca] =
          { itens: Number(l.itens_forecast) || 0, pedidos: Number(l.pedidos_forecast) || 0, rs: Number(l.faturamento_forecast) || 0 };
      });
      dados.forecast = { dias: dias };
    }
  } catch (e) {
    console.error('Panorama: falha ao buscar dados', e);
    if (!dados.resumo) dados.erro = 'Não foi possível ler os dados agora.';   // com dado antigo em tela, só o selo avisa
  }
  render();
}

function render(){
  renderSelo();
  renderOperacao();
  renderPlano();
  document.getElementById('rodape').textContent =
    'Atualiza junto com o telão, a cada rodada do robô · ' + hhmm(new Date());
}

/* ================= controles ================= */
function trocaUnidade(rs){
  if (emRs === rs) return;
  emRs = rs;
  document.getElementById('btItens').classList.toggle('on', !rs);
  document.getElementById('btRs').classList.toggle('on', rs);
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
document.getElementById('btItens').addEventListener('click', function(){ trocaUnidade(false); });
document.getElementById('btRs').addEventListener('click', function(){ trocaUnidade(true); });

Array.prototype.forEach.call(document.querySelectorAll('.aba'), function(b){
  b.addEventListener('click', function(){
    telaAtual = b.dataset.tela;
    Array.prototype.forEach.call(document.querySelectorAll('.aba'), function(x){ x.classList.toggle('on', x === b); });
    document.getElementById('tela-op').classList.toggle('on', telaAtual === 'op');
    document.getElementById('tela-pxr').classList.toggle('on', telaAtual === 'pxr');
    window.scrollTo({ top: 0 });
  });
});

/* ================= login (mesmo acesso do Produtividade) ================= */
async function temPerfil(session){
  var r = await sb.from('perfis_acesso').select('role').eq('user_id', session.user.id).single();
  return !r.error && r.data;
}
async function iniciar(){
  var s = (await sb.auth.getSession()).data.session;
  if (!s || !(await temPerfil(s))) { document.getElementById('login').classList.add('on'); return; }
  document.getElementById('login').classList.remove('on');
  await carregar();
  setInterval(carregar, REFRESH_S * 1000);
  // volta a buscar ao reabrir o app no celular (a aba fica suspensa em segundo plano)
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) carregar(); });
}
document.getElementById('loginForm').addEventListener('submit', async function(e){
  e.preventDefault();
  var u = document.getElementById('loginEmail').value.trim().toLowerCase(), erro = document.getElementById('loginErro');
  erro.textContent = '';
  var r = await sb.auth.signInWithPassword({ email: u.indexOf('@') !== -1 ? u : u + DOMINIO_LOGIN,
                                             password: document.getElementById('loginSenha').value });
  if (r.error) { erro.textContent = 'Usuário ou senha inválidos.'; return; }
  if (!(await temPerfil(r.data.session))) { erro.textContent = 'Usuário sem perfil de acesso. Fale com o admin.'; await sb.auth.signOut(); return; }
  iniciar();
});
iniciar();
})();
</script>
