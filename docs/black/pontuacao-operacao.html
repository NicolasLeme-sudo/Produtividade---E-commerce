<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Como o seu time pontua · Missão Black</title>
<link rel="icon" href="../../logo-mark.png" type="image/png">
<!--
  Folha única (A4, 1 página) para a operação se preparar para a Black. Mesma base visual da página 1 de regras.html.
  Os valores NÃO são digitados aqui: vêm de regras-black.js (pontos, metas de Expedição e Estoque).
  Gerar o PDF: node docs/black/gerar-pdfs.js "C:\Entrega de Arquivos"  (ou Ctrl+P, A4, "gráficos de fundo" ligado).
-->
<script src="../../regras-black.js"></script>
<style>
/* Impressão econômica: tudo preto sobre branco, sem preenchimentos. Só a logo da empresa leva cor. */
:root{--ink:#000;--linha:#000;--tracejado:#9A9A9A;--fonte:"Segoe UI","Segoe UI Semibold",Roboto,"Helvetica Neue",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#E8EBEF;color:var(--ink);font-family:var(--fonte);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
.folha{width:210mm;height:297mm;margin:16px auto;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden}
.topo{padding:24px 30px 18px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;border-bottom:2px solid var(--linha)}
.topo img{width:64px;height:64px;background:#031F44;border-radius:10px;padding:9px;display:block}
.kicker{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin:0 0 5px}
.topo h1{margin:0;font-size:34px;font-weight:900;letter-spacing:-.015em;line-height:1.1}
.corpo{padding:22px 30px 28px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;flex:1}
p{margin:0}
.apoio{font-size:15px;line-height:1.5}
.duas{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:stretch}
.col{display:flex;flex-direction:column;gap:16px}
.caixa{border:1.5px solid var(--linha);border-radius:8px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.caixa.cresce{flex:1;justify-content:space-between}
.caixa h3{margin:0;font-size:17px;font-weight:900;text-transform:uppercase;letter-spacing:.05em}
.lista{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none;flex:1;justify-content:space-between}
.lista li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:baseline;font-size:15.5px;border-bottom:1px dashed var(--tracejado);padding-bottom:9px}
.lista li:last-child{border-bottom:0;padding-bottom:0}
.lista li small{display:block;font-size:12.5px;line-height:1.3}
.lista b{font-variant-numeric:tabular-nums;font-size:17px;white-space:nowrap;font-weight:900}
.exemplo{border:1.5px dashed var(--linha);border-radius:8px;padding:14px 16px;font-size:14.5px}
.exemplo .kicker{margin-bottom:4px}
.exemplo b{font-size:16px}
.ouro{border:2px solid var(--linha);border-radius:8px;padding:16px 20px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.ouro .sel{font-size:40px;font-weight:900;line-height:1}
.ouro p{font-size:15px;line-height:1.45}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h2{margin:0;font-size:16px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}
.sec h2 small{font-size:12.5px;font-weight:600;text-transform:none;letter-spacing:0;margin-left:8px}
.metas{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.meta{border:1.5px solid var(--linha);border-radius:8px;padding:14px 12px;text-align:center}
.meta strong{display:block;font-size:13.5px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.meta b{display:block;font-size:30px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.meta span{display:block;font-size:12.5px;line-height:1.35;margin-top:6px}
@media print{
  body{background:#fff}
  .folha{margin:0;box-shadow:none;height:296mm;break-after:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@page{size:A4;margin:0}
@media screen and (max-width:820px){.folha{width:auto;height:auto;margin:0}.duas,.metas{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
var R = window.RegrasBlack, P = R.P, G = R.GRAVIDADES;
function fmt(n){ return Number(n).toLocaleString('pt-BR'); }
function sinal(n){ return (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n)); }
function lista(itens){
  return '<ul class="lista">' + itens.map(function(i){
    return '<li><span>' + i[0] + (i[2] ? '<small>' + i[2] + '</small>' : '') + '</span><b>' + i[1] + '</b></li>';
  }).join('') + '</ul>';
}
var ganha = [
  ['Cada peça separada ou conferida', sinal(P.porPeca) + ' ponto'],
  ['O time bate a meta do dia', sinal(P.metaBatida)],
  ['Meta batida antes do fim do turno', sinal(P.antecipadaHora) + ' por hora', 'conta os minutos, sem o almoço'],
  ['Time todo presente', 'até ' + fmt(P.assiduidadeMax)],
  ['Gincanas e desafios do dia', 'até ' + fmt(P.desafiosMax)],
  ['Vistoria sem nenhum apontamento', sinal(P.vistoriaLimpa)],
  ['Top separador e top conferente do turno', sinal(P.destaque) + ' cada'],
  ['Presença nos 3 dias (Trinca Perfeita)', sinal(P.trincaPerfeita), 'soma no placar final']
];
var perde = [
  ['Ausência', 'perde a parte da pessoa'],
  ['Atraso não justificado', sinal(P.atraso) + ' por pessoa'],
  ['Vistoria ' + G.leve.rot.toLowerCase(), sinal(G.leve.pts), 'lixo, carrinho fora da vaga, etiqueta no chão'],
  ['Vistoria ' + G.media.rot.toLowerCase(), sinal(G.media.pts), 'caixa aberta no picking, volume no corredor'],
  ['Vistoria ' + G.grave.rot.toLowerCase(), sinal(G.grave.pts), 'sem EPI, rota de fuga ou extintor obstruído'],
  ['Vistoria ' + G.gravissima.rot.toLowerCase(), sinal(G.gravissima.pts), 'subir em estante, correr com carrinho']
];
var ex = 'Exemplo da presença: 10 escalados e 1 ausente → ' + fmt(P.assiduidadeMax) + ' × 9 ÷ 10 = <b>' + fmt(P.assiduidadeMax * 0.9) + ' pontos</b>.';

var html =
 '<section class="folha">' +
  '<div class="topo"><img src="../../logo-mark.png" alt="Vulcabras"><div><p class="kicker">Missão Black Friday 2026 · 27, 28 e 29/11</p><h1>Como o seu time pontua</h1></div></div>' +
  '<div class="corpo">' +
   '<p class="apoio"><b>Todos os pontos são do time.</b> Cada time disputa só com os times do mesmo grupo (checkout, vestuário ou colmeia). A corrida aparece ao vivo no telão e os pontos de cada dia saem na manhã seguinte.</p>' +
   '<div class="duas">' +
     '<div class="caixa cresce"><h3>Seu time ganha</h3>' + lista(ganha) + '</div>' +
     '<div class="col"><div class="caixa cresce"><h3>Seu time perde</h3>' + lista(perde) + '</div>' +
     '<div class="exemplo"><p class="kicker">Na prática</p><p>' + ex + '</p></div></div>' +
   '</div>' +
   '<div class="ouro"><span class="sel">2×</span><div><p class="kicker" style="margin-bottom:3px">Hora que vale ouro</p><p>Anunciada de surpresa no telão. Se o time bater a meta daquela hora, <strong>todas as peças da hora valem o dobro</strong>. Só vale com qualidade e segurança.</p></div></div>' +
   '<div class="sec"><h2>Expedição e Gestão de Estoque<small>metas por resultado, em vez de peças</small></h2><div class="metas">' +
     '<div class="meta"><strong>Expedição</strong><b>' + R.META_EXPEDICAO_PCT + '%</b><span>embarcado do que foi conferido nos caixas de faturamento</span></div>' +
     '<div class="meta"><strong>Cortes</strong><b>' + R.META_CORTE_PCT + '%</b><span>dos cortes sinalizados atendidos no período do ADM</span></div>' +
     '<div class="meta"><strong>Pulas</strong><b>até ' + R.TETO_PULA_PCT + '%</b><span>dos itens das ondas da colmeia ainda em tela</span></div>' +
     '<div class="meta"><strong>FIFO</strong><b>até ' + R.TETO_FIFO_PCT + '%</b><span>dos itens em operação com 2 ou mais dias úteis</span></div>' +
   '</div></div>' +
  '</div>' +
 '</section>';
document.getElementById('app').innerHTML = html;
})();
</script>
</body>
</html>
