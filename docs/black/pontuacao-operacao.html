<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Como o seu time pontua · Missão Black</title>
<link rel="icon" href="../../logo-mark.png" type="image/png">
<!--
  Folha única (A4, 1 página) para a operação se preparar para a Black. Mesma base visual da página 1 de regras.html.
  Os valores NÃO são digitados aqui: vêm de regras-black.js (pontos, metas de Expedição e Estoque).
  Gerar o PDF: node docs/black/gerar-pdfs.js "C:\Entrega de Arquivos"  (ou Ctrl+P, A4, "gráficos de fundo" ligado).
-->
<script src="../../regras-black.js"></script>
<style>
:root{
  --bg:#F4F6F9;--bg-deep:#031F44;--card-bg:#FFFFFF;--card-border:#D5DCE3;--text-primary:#1A3A6B;--text-secondary:#5B6B7C;
  --gold-forte:#F6BD00;--positive:#2E9E2E;--negative:#C0392B;--chip-bg:#EEF2F7;
  --fonte:"Segoe UI","Segoe UI Semibold",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text-primary);font-family:var(--fonte);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.folha{width:210mm;height:297mm;margin:16px auto;background:var(--card-bg);box-shadow:0 1px 2px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden}
.topo{background:var(--bg-deep);color:#fff;padding:20px 28px 18px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.topo img{width:52px;height:52px}
.kicker{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-forte);margin:0 0 6px}
.topo h1{margin:0;font-size:30px;font-weight:900;letter-spacing:-.015em;line-height:1.1}
.regua{height:2px;width:72px;background:var(--gold-forte);border:0;margin:10px 0 0}
.corpo{padding:16px 28px 10px;display:flex;flex-direction:column;gap:13px;flex:1}
p{margin:0}
.apoio{color:var(--text-secondary);font-size:13.5px}
.apoio b{color:var(--text-primary)}
.duas{display:grid;grid-template-columns:1.12fr 1fr;gap:14px;align-items:start}
.caixa{background:var(--card-bg);border:1px solid var(--card-border);border-radius:8px;padding:13px 16px;display:flex;flex-direction:column;gap:7px}
.caixa h3{margin:0;font-size:15.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.ganha h3{color:var(--positive)}.perde h3{color:var(--negative)}
.lista{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.lista li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:baseline;font-size:14px;border-bottom:1px dashed var(--card-border);padding-bottom:5px}
.lista li:last-child{border-bottom:0;padding-bottom:0}
.lista li small{display:block;font-size:11.5px;color:var(--text-secondary);line-height:1.3}
.lista b{font-variant-numeric:tabular-nums;font-size:16px;white-space:nowrap}
.ganha .lista b{color:var(--positive)}.perde .lista b{color:var(--negative)}
.exemplo{background:var(--chip-bg);border-radius:8px;padding:11px 14px;font-size:13px;color:var(--text-primary)}
.exemplo .kicker{color:var(--text-secondary);margin-bottom:3px}
.exemplo b{font-size:15px}
.ouro{background:var(--bg-deep);color:#fff;border-radius:8px;padding:13px 18px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ouro .sel{font-size:30px;font-weight:900;color:var(--gold-forte);line-height:1}
.ouro p{font-size:13.5px;color:#C9D4E3}
.ouro strong{color:#fff}
.sec{display:flex;flex-direction:column;gap:7px}
.sec h2{margin:0;font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.sec h2 small{font-size:11.5px;color:var(--text-secondary);font-weight:600;text-transform:none;letter-spacing:0;margin-left:8px}
.metas{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.meta{border:1px solid var(--card-border);border-top:3px solid var(--gold-forte);border-radius:8px;padding:9px 11px;text-align:center}
.meta b{display:block;font-size:22px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.meta span{display:block;font-size:11.5px;color:var(--text-secondary);line-height:1.3;margin-top:3px}
.meta strong{display:block;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.premios{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:10px}
.premio{background:var(--chip-bg);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--text-secondary);line-height:1.35}
.premio strong{display:block;font-size:13.5px;color:var(--text-primary);margin-bottom:2px}
.premio.dia{background:var(--bg-deep);color:#C9D4E3}
.premio.dia strong{color:var(--gold-forte)}
.rodape{display:flex;justify-content:space-between;gap:12px;font-size:11px;color:var(--text-secondary);border-top:1px solid var(--card-border);padding:9px 28px}
@media print{
  body{background:#fff}
  .folha{margin:0;box-shadow:none;height:296mm;break-after:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@page{size:A4;margin:0}
@media screen and (max-width:820px){.folha{width:auto;height:auto;margin:0}.duas,.metas,.premios{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
var R = window.RegrasBlack, P = R.P, G = R.GRAVIDADES;
function fmt(n){ return Number(n).toLocaleString('pt-BR'); }
function sinal(n){ return (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n)); }
function lista(itens){
  return '<ul class="lista">' + itens.map(function(i){
    return '<li><span>' + i[0] + (i[2] ? '<small>' + i[2] + '</small>' : '') + '</span><b>' + i[1] + '</b></li>';
  }).join('') + '</ul>';
}
var ganha = [
  ['Cada peça separada ou conferida', sinal(P.porPeca) + ' ponto'],
  ['O time bate a meta do dia', sinal(P.metaBatida)],
  ['Meta batida antes do fim do turno', sinal(P.antecipadaHora) + ' por hora', 'conta os minutos, sem o almoço'],
  ['Time todo presente', 'até ' + fmt(P.assiduidadeMax)],
  ['Gincanas e desafios do dia', 'até ' + fmt(P.desafiosMax)],
  ['Vistoria sem nenhum apontamento', sinal(P.vistoriaLimpa)],
  ['Top separador e top conferente do turno', sinal(P.destaque) + ' cada'],
  ['Presença nos 3 dias (Trinca Perfeita)', sinal(P.trincaPerfeita), 'soma no placar final']
];
var perde = [
  ['Ausência', 'perde a parte da pessoa'],
  ['Atraso não justificado', sinal(P.atraso) + ' por pessoa'],
  ['Vistoria ' + G.leve.rot.toLowerCase(), sinal(G.leve.pts), 'lixo, carrinho fora da vaga, etiqueta no chão'],
  ['Vistoria ' + G.media.rot.toLowerCase(), sinal(G.media.pts), 'caixa aberta no picking, volume no corredor'],
  ['Vistoria ' + G.grave.rot.toLowerCase(), sinal(G.grave.pts), 'sem EPI, rota de fuga ou extintor obstruído'],
  ['Vistoria ' + G.gravissima.rot.toLowerCase(), sinal(G.gravissima.pts), 'subir em estante, correr com carrinho']
];
var ex = 'Exemplo da presença: 10 escalados e 1 ausente → ' + fmt(P.assiduidadeMax) + ' × 9 ÷ 10 = <b>' + fmt(P.assiduidadeMax * 0.9) + ' pontos</b>.';

var html =
 '<section class="folha">' +
  '<div class="topo"><img src="../../logo-mark.png" alt="Vulcabras"><div><p class="kicker">Missão Black Friday 2026 · 27, 28 e 29/11</p><h1>Como o seu time pontua</h1><hr class="regua"></div></div>' +
  '<div class="corpo">' +
   '<p class="apoio"><b>Todos os pontos são do time.</b> Cada time disputa só com os times do mesmo grupo (checkout, vestuário ou colmeia). A corrida aparece ao vivo no telão e os pontos de cada dia saem na manhã seguinte.</p>' +
   '<div class="duas">' +
     '<div class="caixa ganha"><h3>Seu time ganha</h3>' + lista(ganha) + '</div>' +
     '<div style="display:flex;flex-direction:column;gap:13px"><div class="caixa perde"><h3>Seu time perde</h3>' + lista(perde) + '</div>' +
     '<div class="exemplo"><p class="kicker">Na prática</p><p>' + ex + '</p></div></div>' +
   '</div>' +
   '<div class="ouro"><span class="sel">2×</span><div><p class="kicker" style="margin-bottom:2px">Hora que vale ouro</p><p>Anunciada de surpresa no telão. Se o time bater a meta daquela hora, <strong>todas as peças da hora valem o dobro</strong>. Só vale com qualidade e segurança.</p></div></div>' +
   '<div class="sec"><h2>Expedição e Gestão de Estoque<small>metas por resultado, em vez de peças</small></h2><div class="metas">' +
     '<div class="meta"><strong>Expedição</strong><b>' + R.META_EXPEDICAO_PCT + '%</b><span>embarcado do que foi conferido nos caixas de faturamento</span></div>' +
     '<div class="meta"><strong>Cortes</strong><b>' + R.META_CORTE_PCT + '%</b><span>dos cortes sinalizados atendidos no período do ADM</span></div>' +
     '<div class="meta"><strong>Pulas</strong><b>até ' + R.TETO_PULA_PCT + '%</b><span>dos itens das ondas da colmeia ainda em tela</span></div>' +
     '<div class="meta"><strong>FIFO</strong><b>até ' + R.TETO_FIFO_PCT + '%</b><span>dos itens em operação com 2 ou mais dias úteis</span></div>' +
   '</div></div>' +
   '<div class="sec"><h2>Quem leva o prêmio</h2><div class="premios">' +
     '<div class="premio dia"><strong>★ Todo dia, em cada turno</strong>O time que mais produzir no T01 e no T02 é premiado, na sexta, no sábado e no domingo.</div>' +
     '<div class="premio"><strong>Campeão Black Friday</strong>Maior pontuação somada nos 3 dias, por turno.</div>' +
     '<div class="premio"><strong>Time 100%</strong>Presença total nos 3 dias.</div>' +
   '</div></div>' +
   '<p class="apoio" style="font-size:12px">A vistoria passa em horário aleatório e o desconto é lançado na hora. Todo ponto fica registrado com horário, motivo e quem lançou. Dúvidas? Fale com o líder do seu turno.</p>' +
  '</div>' +
  '<div class="rodape"><span>Missão Black 2026 · 27 a 30 de novembro · E-commerce Vulcabras</span><span>Folha da operação</span></div>' +
 '</section>';
document.getElementById('app').innerHTML = html;
})();
</script>
</body>
</html>
