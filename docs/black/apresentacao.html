<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Missão Black 2026</title>
<link rel="icon" href="img/favicon.png">
<!-- Padrão de apresentação HTML Vulcabras (report-DISTR/.claude/skills/apresentacao-html/modelo.html).
     Valores de pontos vêm de regras-black.js. Arquivo único para enviar: python docs/black/embutir.py saida.html -->
<script src="../../regras-black.js"></script>
<style>
:root{--navy:#031F44;--ink:#0B1626;--card:#16263C;--card2:#1D3048;--line:#2C4260;--fg:#F4F7FB;--muted:#93A5B8;--gold:#F6BD00;--red:#E03A4E;--steel:#4F6784;--sky:#A8D8F8;--green:#4CC38A;
  --t1:#EF5B5B;--t2:#4C95F0;--t3:#45C665;--t4:#F6C400;--t5:#EC4FA0;--t6:#A773EA}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#050C17;color:var(--fg);font-family:'Segoe UI',Tahoma,system-ui,sans-serif;overflow:hidden}
#viewport{position:fixed;inset:0;overflow:hidden}
#stage{width:1920px;height:1080px;position:absolute;left:50%;top:50%;transform-origin:center;overflow:hidden;border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.slide{position:absolute;inset:0;padding:110px 128px 150px;display:flex;flex-direction:column;gap:32px;opacity:0;visibility:hidden;transform:translateX(40px);transition:opacity .5s ease,transform .5s ease,visibility .5s;background:radial-gradient(1200px 700px at 85% -10%,#12325C 0%,transparent 60%),linear-gradient(180deg,#0E1C30,#0A1422)}
.slide.on{opacity:1;visibility:visible;transform:none}
.slide.prev{transform:translateX(-40px)}
.eyebrow{font-size:22px;font-weight:700;letter-spacing:5px;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:16px}
.eyebrow::before{content:"";width:44px;height:3px;background:var(--gold);border-radius:2px}
h1{font-size:96px;line-height:1.05;font-weight:700;letter-spacing:-1px;max-width:1450px}
h2{font-size:58px;line-height:1.12;font-weight:700;letter-spacing:-.5px;max-width:1600px;text-wrap:balance}
h2 em{font-style:normal;color:var(--gold)}
.foot{position:absolute;left:128px;right:128px;bottom:56px;display:flex;justify-content:space-between;align-items:center;font-size:20px;color:var(--muted);border-top:1px solid var(--line);padding-top:20px}
.foot img{height:34px;opacity:.9} .foot img.vm{height:44px;opacity:1}
.cards{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:28px}
.card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:40px 40px;min-width:0;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.card .k{font-size:24px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;font-weight:600}
.card .v{font-size:92px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
.card .d{font-size:26px;color:var(--muted);line-height:1.4}
.card.red .v{color:var(--red)} .card.red::after,.card.gold::after,.card.green::after{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--red)}
.card.gold::after{background:var(--gold)} .card.gold .v{color:var(--gold)} .card.green .v{color:var(--green)} .card.green::after{background:var(--green)}
.lead{font-size:30px;line-height:1.5;color:#D5DEE8;max-width:1500px} .lead b{color:var(--fg)}
/* capa */
.capa{justify-content:center;background:radial-gradient(1000px 800px at 90% 110%,#173E70 0%,transparent 60%),linear-gradient(135deg,#031F44,#0A1422)}
.capa .logo{position:absolute;top:90px;left:128px;height:80px}
.capa .sub{font-size:36px;color:var(--muted);max-width:1300px;line-height:1.4}
.capa .rule{width:220px;height:4px;background:var(--gold);border-radius:2px}
.capa .tag{position:absolute;left:128px;bottom:96px;font-size:24px;color:var(--muted)}
.capa .big{position:absolute;right:110px;bottom:60px;font-size:420px;font-weight:800;color:rgba(255,255,255,.035);line-height:1;letter-spacing:-10px}
.legend{display:flex;gap:32px;font-size:22px;color:var(--muted)} .legend i{display:inline-block;width:18px;height:18px;border-radius:4px;margin-right:10px;vertical-align:-2px}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:start}
table{border-collapse:collapse;width:100%;font-size:30px;font-variant-numeric:tabular-nums}
th{font-size:20px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;font-weight:600;text-align:right;padding:0 18px 16px;border-bottom:2px solid var(--line)}
td{padding:22px 18px;text-align:right;border-bottom:1px solid var(--line)} th:first-child,td:first-child{text-align:left}
td.hl{font-weight:700;color:var(--gold)}
.stack{display:flex;flex-direction:column;gap:20px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 32px;display:flex;justify-content:space-between;align-items:baseline}
.pill span{font-size:24px;color:var(--muted)} .pill b{font-size:52px;font-weight:300} .pill.r b{color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.lev{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:36px 40px;display:flex;gap:28px}
.lev .n{font-size:64px;font-weight:200;color:var(--gold);line-height:.9;min-width:56px}
.lev h3{font-size:34px;margin-bottom:10px} .lev p{font-size:26px;line-height:1.45;color:#D5DEE8} .lev p b{color:var(--fg)}
.prem{display:grid;grid-template-columns:1fr 1fr;gap:40px 64px}
.prem div{border-left:3px solid var(--gold);padding-left:28px}
.prem h3{font-size:30px;color:var(--gold);margin-bottom:10px} .prem p{font-size:26px;line-height:1.45;color:#D5DEE8}
/* complementos da Missão Black */
.prem .dia{font-size:20px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;font-weight:600;margin-bottom:6px}
.prem ul,.card ul,.lev ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.prem li,.lev li{font-size:24px;line-height:1.4;color:#D5DEE8} .card li{font-size:22px;line-height:1.4;color:var(--muted)}
.prem li::before,.card li::before,.lev li::before{content:"· ";color:var(--gold);font-weight:700}
.chips{display:flex;gap:14px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:10px;font-size:22px;font-weight:600;padding:8px 18px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.chip i{width:16px;height:16px;border-radius:50%;background:var(--c)}
.shot{display:flex;flex-direction:column;gap:12px;min-height:0}
.shot img{width:100%;max-height:560px;object-fit:contain;object-position:top left;border:1px solid var(--line);border-radius:14px;background:#0F1623}
.shot span{font-size:22px;color:var(--muted)}
table.cmp td{padding:13px 18px;font-size:26px} table.cmp td.neg{color:var(--red)} table.cmp tr.tot td{border-top:2px solid var(--gold);border-bottom:0;font-weight:700;font-size:30px}
/* apresentação enxuta (03/11) */
.tl{display:grid;grid-template-columns:repeat(5,1fr);position:relative;margin-top:40px;margin-bottom:36px}
.tl-m{position:relative;text-align:center}
.tl-m h3,.tl-m ul{padding:0 14px}
.tl-d{display:block;font-size:52px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
.tl-d small{display:block;font-size:20px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:8px;font-weight:600}
.tl-p{position:relative;height:26px;margin:16px 0 26px}
.tl-p::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;background:var(--line)}
.tl-m i{display:block;width:26px;height:26px;border-radius:50%;background:var(--card2);border:3px solid var(--steel);margin:0 auto;position:relative;z-index:1}
.tl-m.on i{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 8px rgba(246,189,0,.15)}
.tl-m h3{font-size:34px;margin-bottom:12px} .tl-m.on h3{color:var(--gold)} .tl-m ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;align-items:center} .tl-m li{font-size:23px;line-height:1.4;color:#D5DEE8}
.dias{display:grid;grid-template-columns:repeat(5,1fr);gap:22px;flex:1;min-height:0}
.dia-c{padding:30px 28px;gap:12px} .dia-c h3{font-size:32px;color:var(--gold)} .dia-c li{font-size:21px;color:#D5DEE8}
.dia-c .atr{display:flex;flex-direction:column;gap:8px}
.dia-c .sub-t{font-size:18px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;font-weight:700;margin-top:6px}
.dia-c .atr span{font-size:19px;color:var(--sky);font-weight:600} .dia-c .atr span::before{content:"♪ ";color:var(--gold)}
.gam{display:grid;grid-template-columns:1.55fr 1fr;gap:48px;align-items:start}
.gk{font-size:22px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--green);margin-bottom:8px} .gk.r{color:var(--red)} .gk small{font-size:16px;color:var(--muted);letter-spacing:1px;margin-left:10px}
table.gt td{padding:7px 14px;font-size:21px} table.gt th{font-size:15px;padding:0 14px 8px} table.gt td:first-child,table.gt td:nth-child(3),table.gt td:nth-child(4){white-space:nowrap}
.nota{font-size:21px;line-height:1.45;color:#D5DEE8;margin-top:22px} .nota b{color:var(--fg)}
.aud{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:14px;padding:18px 26px;font-size:19px;color:#D5DEE8}
.aud b{color:var(--gold);font-size:20px;letter-spacing:2px;text-transform:uppercase;margin-right:6px} .aud span::after{content:"·";margin-left:14px;color:var(--steel)} .aud span:last-child::after{content:""}
.gin{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.gin-c{flex-direction:row;gap:22px;padding:24px 28px;align-items:flex-start}
.gin-c .n{font-size:46px;font-weight:200;color:var(--gold);line-height:1;min-width:40px}
.gin-c h3{font-size:28px;margin-bottom:6px} .gin-c p{font-size:20px;line-height:1.4;color:#D5DEE8}
/* UI */
#ui{position:fixed;right:20px;top:16px;display:flex;gap:8px;align-items:center;z-index:5;opacity:.35;transition:opacity .3s}
#ui:hover,body.mouse #ui{opacity:1}
#ui button{width:46px;height:46px;border-radius:12px;border:1px solid #2C4260;background:rgba(14,28,48,.9);color:#F4F7FB;font-size:20px;cursor:pointer;display:grid;place-items:center}
#ui button:hover{background:#1D3048;border-color:var(--gold)} #ui button:focus-visible{outline:2px solid var(--gold)}
#count{font-size:15px;color:var(--muted);min-width:58px;text-align:center;font-variant-numeric:tabular-nums}
#bar{position:fixed;left:0;top:0;height:4px;background:var(--gold);transition:width .4s;z-index:5}
@media (prefers-reduced-motion:reduce){.slide{transition:none}}
</style></head><body>
<div id="bar"></div>
<div id="viewport"><div id="stage"></div></div>
<div id="ui">
  <button id="bPrev" title="Slide anterior (←)" aria-label="Slide anterior">‹</button>
  <span id="count"></span>
  <button id="bNext" title="Próximo slide (→)" aria-label="Próximo slide">›</button>
  <button id="bFull" title="Tela cheia (F)" aria-label="Tela cheia">⛶</button>
</div>
<script>
(function(){
'use strict';
var R = window.RegrasBlack, P = R.P;
function fmt(n){ return Number(n).toLocaleString('pt-BR'); }
function sinal(n){ return (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n)); }
function col(n){ return Math.round(n * R.FATOR_COLMEIA); }
function li(a){ return '<ul>' + a.map(function(x){ return '<li>' + x + '</li>'; }).join('') + '</ul>'; }
function foot(t){ return '<div class="foot"><span>' + t + '</span><img class="vm" src="img/v-vulcabras.png" alt="Vulcabras"></div>'; }
function slide(eb, titulo, corpo, rod){ return '<section class="slide"><div class="eyebrow">' + eb + '</div><h2>' + titulo + '</h2>' + corpo + foot(rod) + '</section>'; }
var CORES = [['Vermelho','--t1'],['Azul','--t2'],['Verde','--t3'],['Amarelo','--t4'],['Rosa','--t5'],['Roxo','--t6']];
function chips(lista){ return '<div class="chips">' + lista.map(function(c){ return '<span class="chip" style="--c:var(' + c[1] + ')"><i></i>' + c[0] + '</span>'; }).join('') + '</div>'; }
var RODAPE = 'Missão Black 2026 · 27 a 30 de novembro';

var S = [];
// 1 · capa
S.push('<section class="slide capa"><img class="logo" src="img/logo-vulcabras.png" alt="Vulcabras"><div class="eyebrow">E-commerce · Vulcabras</div>' +
  '<h1>Missão Black 2026</h1><div class="rule"></div>' +
  '<p class="sub">27, 28 e 29 de novembro, com encerramento na segunda, 30/11: programação, gamificação e gincanas.</p>' +
  '<div class="tag">Apresentação à coordenação · 03/11/2026</div><div class="big">BLACK</div></section>');

// 2 · linha do tempo
var MARCOS = [['20/11','sex','Pré-Black',['Entrega das camisetas','Apresentação da gamificação']],
  ['27/11','sex','Largada Black',['Abertura oficial e café','Primeiros desafios']],
  ['28/11','sáb','Superação',['Apuração do 1º dia','Premiação e novos desafios']],
  ['29/11','dom','Grande Final',['Apuração do 2º dia','Última rodada de desafios']],
  ['30/11','seg','Encerramento',['Time campeão','Agradecimentos e café']]];
S.push(slide('Visão geral', 'Do aquecimento ao <em>time campeão</em>',
  '<div class="tl">' + MARCOS.map(function(m, k){
    return '<div class="tl-m' + (k > 0 && k < 4 ? ' on' : '') + '"><span class="tl-d">' + m[0] + '<small>' + m[1] + '</small></span><div class="tl-p"><i></i></div><h3>' + m[2] + '</h3>' + li(m[3]) + '</div>';
  }).join('') + '</div>' +
  '<p class="lead">Três dias de competição entre <b>6 times: 4 no checkout e 2 na colmeia, em cada turno</b>. Os pontos de cada dia são apurados <b>na manhã seguinte</b>.</p>',
  RODAPE));

// 3 · a campanha
S.push(slide('A campanha', 'Um time de cada cor, <em>em cada turno</em>',
  '<div class="two"><div class="stack">' +
    Object.keys(R.TURNOS).map(function(k){ var t = R.TURNOS[k].rot.split(' · '); return '<div class="pill"><span>' + t[0] + '</span><b>' + t[1] + '</b></div>'; }).join('') +
  '</div><div class="stack">' +
    '<div class="lev"><div class="n">4</div><div><h3>Times no checkout</h3><p>Separadores e conferentes em cada time. <b>Checkout disputa com checkout.</b></p><div style="margin-top:16px">' + chips(CORES.slice(0,4)) + '</div></div></div>' +
    '<div class="lev"><div class="n">2</div><div><h3>Times na colmeia</h3><p>Mesma divisão. <b>Colmeia disputa com colmeia</b>, com meta e pontos fixos proporcionais (×' + String(R.FATOR_COLMEIA).replace('.',',') + ').</p><div style="margin-top:16px">' + chips(CORES.slice(4)) + '</div></div></div>' +
  '</div></div>',
  RODAPE));

// 4 · cronograma e atrações
var DIAS_C = [['20/11 · sex','Pré-Black',['Entrega das camisetas','Apresentação da gamificação','Folha de regras nos pisos'],null,[]],
  ['27/11 · sex','Largada Black',['Abertura oficial','Fala do diretor e do gerente','Vídeo motivacional'],R.DESAFIOS['2026-11-27'],['DJ','Café de abertura']],
  ['28/11 · sáb','Superação',['Apuração e premiação do 1º dia'],R.DESAFIOS['2026-11-28'],['DJ','Pastel e refrigerante']],
  ['29/11 · dom','Grande Final',['Apuração e premiação do 2º dia'],R.DESAFIOS['2026-11-29'],['DJ','Kit energia: batata, energético e chocolate']],
  ['30/11 · seg','Encerramento',['Apuração do 3º dia','Time campeão da gincana','Fala do diretor e do gerente'],null,['DJ','Café de encerramento']]];
S.push(slide('Cronograma e atrações', 'O que acontece <em>em cada dia</em>',
  '<div class="dias">' + DIAS_C.map(function(d){
    return '<div class="card dia-c"><p class="k">' + d[0] + '</p><h3>' + d[1] + '</h3>' + li(d[2]) +
      (d[3] && d[3].length ? '<p class="sub-t">Desafios</p>' + li(d[3]) : '') +
      (d[4].length ? '<p class="sub-t">Atrações</p><div class="atr">' + d[4].map(function(a){ return '<span>' + a + '</span>'; }).join('') + '</div>' : '') + '</div>';
  }).join('') + '</div>',
  RODAPE));

// 5 · gamificação
var GANHA = [['Produtividade','cada peça separada ou conferida','1/peça','1/peça'],
  ['Assiduidade','time todo presente; cada ausência tira a parte da pessoa','até ' + fmt(P.assiduidadeMax),'até ' + fmt(col(P.assiduidadeMax))],
  ['Gincanas e desafios','soma do dia','até ' + fmt(P.desafiosMax),'até ' + fmt(col(P.desafiosMax))],
  ['Meta do dia','bateu a meta do time',sinal(P.metaBatida),sinal(col(P.metaBatida))],
  ['Meta antecipada','por hora trabalhada antes do fim do turno, contando os minutos (sem o almoço)',sinal(P.antecipadaHora) + '/h',sinal(col(P.antecipadaHora)) + '/h'],
  ['Hora que vale ouro','peças da hora em dobro','2×','2×'],
  ['Destaque do turno','top separador e top conferente',sinal(P.destaque),sinal(col(P.destaque))],
  ['Vistoria sem apontamento','vistoria do dia sem nenhum item marcado',sinal(P.vistoriaLimpa),sinal(col(P.vistoriaLimpa))],
  ['Trinca Perfeita','100% de presença nos 3 dias',sinal(P.trincaPerfeita),sinal(col(P.trincaPerfeita))]];
var PERDE = [['Ausência','sai a parte da pessoa na presença'],['Atraso não justificado',sinal(P.atraso) + ' por pessoa'],['Vistoria','desconto por item encontrado']];
S.push(slide('Gamificação', 'Como um time <em>ganha a Black</em>',
  '<div class="gam"><div><p class="gk">Ganha <small>pontos do time</small></p><table class="cmp gt"><tr><th>Bloco</th><th style="text-align:left">Como conta</th><th>Checkout</th><th>Colmeia</th></tr>' +
    GANHA.map(function(r){ return '<tr><td><b>' + r[0] + '</b></td><td style="text-align:left;color:var(--muted)">' + r[1] + '</td><td class="hl">' + r[2] + '</td><td>' + r[3] + '</td></tr>'; }).join('') +
  '</table></div><div><p class="gk r">Perde</p><table class="cmp gt">' +
    PERDE.map(function(r){ return '<tr><td><b>' + r[0] + '</b></td><td class="neg">' + r[1] + '</td></tr>'; }).join('') +
  '</table><p class="nota"><span style="white-space:nowrap">Exemplo: 10 escalados e 1 ausente → ' + fmt(P.assiduidadeMax) + ' × 9 ÷ 10 = <b>' + fmt(P.assiduidadeMax * 0.9) + '</b></span><br>Colmeia: valores fixos ×' + String(R.FATOR_COLMEIA).replace('.', ',') + '.</p></div></div>',
  'Todos os pontos são do time: a produtividade soma as peças de todos os membros'));

// 6 · vistoria
S.push(slide('Vistoria', 'Segurança, qualidade e 5S <em>nos pisos</em>',
  '<div class="cards">' +
    Object.keys(R.GRAVIDADES).map(function(g){ var its = R.CHECKLIST.filter(function(c){ return c.grav === g; }); return '<div class="card red"><div class="k">' + R.GRAVIDADES[g].rot + '</div><div class="v">' + sinal(R.GRAVIDADES[g].pts) + '</div>' + li(its.map(function(c){ return c.item; })) + '</div>'; }).join('') +
  '</div><p class="lead">Vistoria em <b>horário aleatório</b>, por time. O vistoriador marca o checklist e o desconto é lançado na hora. Vistoria sem nenhum apontamento vale <b>' + sinal(P.vistoriaLimpa) + '</b>.</p>',
  'Checklist impresso na mão dos líderes · colmeia: descontos ×' + String(R.FATOR_COLMEIA).replace('.', ',')));

// 7 · gincanas
S.push(slide('Gincanas', 'Competição entre times, <em>com prêmio no dia</em>',
  '<div class="gin">' + R.GINCANAS.map(function(g, k){
    return '<div class="card gin-c"><span class="n">' + (k + 1) + '</span><div><h3>' + g + '</h3><p>' + ((R.GINCANAS_DESC || {})[g] || '') + '</p></div></div>';
  }).join('') + '</div>' +
  '<p class="lead">Prêmio do dia para o time vencedor: <b>a decidir</b>. Cada gincana vale até ' + fmt(R.PONTOS_DESAFIO) + ' pontos por time (' + fmt(col(R.PONTOS_DESAFIO)) + ' na colmeia), dentro do limite de ' + fmt(P.desafiosMax) + ' por dia.</p>',
  RODAPE));

// 8 · premiação e próximos passos
S.push(slide('Reconhecimento e próximos passos', 'Quem leva <em>e o que falta decidir</em>',
  '<div class="two" style="grid-template-columns:1.25fr 1fr">' +
    '<div class="prem" style="grid-template-columns:1fr 1fr;gap:30px 44px">' +
      '<div><h3>Campeão Black Friday</h3><p>Maior pontuação acumulada nos 3 dias, por turno.</p></div>' +
      '<div><h3>Time Performance</h3><p>Maior produtividade acumulada no período.</p></div>' +
      '<div><h3>Time 100%</h3><p>Trinca Perfeita: presença total nos 3 dias.</p></div>' +
      '<div><h3>Destaque do turno</h3><p>Top separador e top conferente de cada dia.</p></div>' +
      '<div><h3>Vistoria nota 10</h3><p>Mais vistorias sem apontamento.</p></div>' +
      '<div><h3>Prêmios instantâneos</h3><p>Brindes e Golden Tickets ao longo dos 3 dias.</p></div>' +
    '</div>' +
    '<div class="lev"><div class="n">→</div><div><h3>Próximos passos</h3>' + li(['Metas oficiais por time (hoje: 2.000 checkout · 1.200 colmeia)','Escalação final com presença (planilha por cor)','Vistoriadores e agenda das horas de ouro']) + '</div></div>' +
  '</div>',
  RODAPE));

document.getElementById('stage').innerHTML = S.join('');
})();
</script>
<script>
const S=[...document.querySelectorAll('.slide')], st=document.getElementById('stage');
let i=0;
function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);st.style.transform='translate(-50%,-50%) scale('+k+')';}
function show(n){i=Math.max(0,Math.min(S.length-1,n));S.forEach((s,j)=>{s.classList.toggle('on',j===i);s.classList.toggle('prev',j<i);});
 document.getElementById('count').textContent=(i+1)+' / '+S.length;document.getElementById('bar').style.width=((i+1)/S.length*100)+'%';
 try{history.replaceState(null,'','#'+(i+1));}catch(e){}}
function full(){const d=document,el=d.documentElement;
 if(!(d.fullscreenElement||d.webkitFullscreenElement)){const r=(el.requestFullscreen||el.webkitRequestFullscreen);if(r){const p=r.call(el);if(p&&p.catch)p.catch(()=>{});}}
 else (d.exitFullscreen||d.webkitExitFullscreen).call(d);}
document.getElementById('bPrev').onclick=()=>show(i-1);
document.getElementById('bNext').onclick=()=>show(i+1);
document.getElementById('bFull').onclick=full;
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();show(i+1);}
 else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();show(i-1);}
 else if(e.key==='f'||e.key==='F')full(); else if(e.key==='Home')show(0); else if(e.key==='End')show(S.length-1);});
let tx=null;addEventListener('touchstart',e=>tx=e.touches[0].clientX);addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)show(i+(dx<0?1:-1));tx=null;});
let tm;addEventListener('mousemove',()=>{document.body.classList.add('mouse');clearTimeout(tm);tm=setTimeout(()=>document.body.classList.remove('mouse'),2000);});
addEventListener('resize',fit);fit();show((parseInt(location.hash.slice(1))||1)-1);
</script>
</body></html>
