<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Missão Black · Liderança</title>
<link rel="icon" href="img/favicon.png">
<!-- Padrão de apresentação HTML Vulcabras (report-DISTR/.claude/skills/apresentacao-html/modelo.html).
     Valores de pontos vêm de regras-black.js. Arquivo único para enviar: python docs/black/embutir.py saida.html -->
<script src="../../regras-black.js"></script>
<style>
:root{--navy:#031F44;--ink:#0B1626;--card:#16263C;--card2:#1D3048;--line:#2C4260;--fg:#F4F7FB;--muted:#93A5B8;--gold:#F6BD00;--red:#E03A4E;--steel:#4F6784;--sky:#A8D8F8;--green:#4CC38A;
  --t1:#EF5B5B;--t2:#4C95F0;--t3:#45C665;--t4:#F6C400;--t5:#EC4FA0;--t6:#A773EA}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#050C17;color:var(--fg);font-family:'Segoe UI',Tahoma,system-ui,sans-serif;overflow:hidden}
#viewport{position:fixed;inset:0;overflow:hidden}
#stage{width:1920px;height:1080px;position:absolute;left:50%;top:50%;transform-origin:center;overflow:hidden;border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.slide{position:absolute;inset:0;padding:110px 128px 150px;display:flex;flex-direction:column;gap:32px;opacity:0;visibility:hidden;transform:translateX(40px);transition:opacity .5s ease,transform .5s ease,visibility .5s;background:radial-gradient(1200px 700px at 85% -10%,#12325C 0%,transparent 60%),linear-gradient(180deg,#0E1C30,#0A1422)}
.slide.on{opacity:1;visibility:visible;transform:none}
.slide.prev{transform:translateX(-40px)}
.eyebrow{font-size:22px;font-weight:700;letter-spacing:5px;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:16px}
.eyebrow::before{content:"";width:44px;height:3px;background:var(--gold);border-radius:2px}
h1{font-size:96px;line-height:1.05;font-weight:700;letter-spacing:-1px;max-width:1450px}
h2{font-size:58px;line-height:1.12;font-weight:700;letter-spacing:-.5px;max-width:1600px;text-wrap:balance}
h2 em{font-style:normal;color:var(--gold)}
.foot{position:absolute;left:128px;right:128px;bottom:56px;display:flex;justify-content:space-between;align-items:center;font-size:20px;color:var(--muted);border-top:1px solid var(--line);padding-top:20px}
.foot img{height:34px;opacity:.9} .foot img.vm{height:44px;opacity:1}
.cards{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:28px}
.card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:40px 40px;min-width:0;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.card .k{font-size:24px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;font-weight:600}
.card .v{font-size:92px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
.card .d{font-size:26px;color:var(--muted);line-height:1.4}
.card.red .v{color:var(--red)} .card.red::after,.card.gold::after,.card.green::after{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--red)}
.card.gold::after{background:var(--gold)} .card.gold .v{color:var(--gold)} .card.green .v{color:var(--green)} .card.green::after{background:var(--green)}
.lead{font-size:30px;line-height:1.5;color:#D5DEE8;max-width:1500px} .lead b{color:var(--fg)}
/* capa */
.capa{justify-content:center;background:radial-gradient(1000px 800px at 90% 110%,#173E70 0%,transparent 60%),linear-gradient(135deg,#031F44,#0A1422)}
.capa .logo{position:absolute;top:90px;left:128px;height:80px}
.capa .sub{font-size:36px;color:var(--muted);max-width:1300px;line-height:1.4}
.capa .rule{width:220px;height:4px;background:var(--gold);border-radius:2px}
.capa .tag{position:absolute;left:128px;bottom:96px;font-size:24px;color:var(--muted)}
.capa .big{position:absolute;right:110px;bottom:60px;font-size:420px;font-weight:800;color:rgba(255,255,255,.035);line-height:1;letter-spacing:-10px}
.legend{display:flex;gap:32px;font-size:22px;color:var(--muted)} .legend i{display:inline-block;width:18px;height:18px;border-radius:4px;margin-right:10px;vertical-align:-2px}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:start}
table{border-collapse:collapse;width:100%;font-size:30px;font-variant-numeric:tabular-nums}
th{font-size:20px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;font-weight:600;text-align:right;padding:0 18px 16px;border-bottom:2px solid var(--line)}
td{padding:22px 18px;text-align:right;border-bottom:1px solid var(--line)} th:first-child,td:first-child{text-align:left}
td.hl{font-weight:700;color:var(--gold)}
.stack{display:flex;flex-direction:column;gap:20px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 32px;display:flex;justify-content:space-between;align-items:baseline}
.pill span{font-size:24px;color:var(--muted)} .pill b{font-size:52px;font-weight:300} .pill.r b{color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.lev{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:36px 40px;display:flex;gap:28px}
.lev .n{font-size:64px;font-weight:200;color:var(--gold);line-height:.9;min-width:56px}
.lev h3{font-size:34px;margin-bottom:10px} .lev p{font-size:26px;line-height:1.45;color:#D5DEE8} .lev p b{color:var(--fg)}
.prem{display:grid;grid-template-columns:1fr 1fr;gap:40px 64px}
.prem div{border-left:3px solid var(--gold);padding-left:28px}
.prem h3{font-size:30px;color:var(--gold);margin-bottom:10px} .prem p{font-size:26px;line-height:1.45;color:#D5DEE8}
/* complementos da Missão Black */
.prem .dia{font-size:20px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;font-weight:600;margin-bottom:6px}
.prem ul,.card ul,.lev ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.prem li,.lev li{font-size:24px;line-height:1.4;color:#D5DEE8} .card li{font-size:22px;line-height:1.4;color:var(--muted)}
.prem li::before,.card li::before,.lev li::before{content:"· ";color:var(--gold);font-weight:700}
.chips{display:flex;gap:14px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:10px;font-size:22px;font-weight:600;padding:8px 18px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.chip i{width:16px;height:16px;border-radius:50%;background:var(--c)}
.shot{display:flex;flex-direction:column;gap:12px;min-height:0}
.shot img{width:100%;max-height:560px;object-fit:contain;object-position:top left;border:1px solid var(--line);border-radius:14px;background:#0F1623}
.shot span{font-size:22px;color:var(--muted)}
table.cmp td{padding:13px 18px;font-size:26px} table.cmp td.neg{color:var(--red)} table.cmp tr.tot td{border-top:2px solid var(--gold);border-bottom:0;font-weight:700;font-size:30px}
/* UI */
#ui{position:fixed;right:20px;top:16px;display:flex;gap:8px;align-items:center;z-index:5;opacity:.35;transition:opacity .3s}
#ui:hover,body.mouse #ui{opacity:1}
#ui button{width:46px;height:46px;border-radius:12px;border:1px solid #2C4260;background:rgba(14,28,48,.9);color:#F4F7FB;font-size:20px;cursor:pointer;display:grid;place-items:center}
#ui button:hover{background:#1D3048;border-color:var(--gold)} #ui button:focus-visible{outline:2px solid var(--gold)}
#count{font-size:15px;color:var(--muted);min-width:58px;text-align:center;font-variant-numeric:tabular-nums}
#bar{position:fixed;left:0;top:0;height:4px;background:var(--gold);transition:width .4s;z-index:5}
@media (prefers-reduced-motion:reduce){.slide{transition:none}}
</style></head><body>
<div id="bar"></div>
<div id="viewport"><div id="stage"></div></div>
<div id="ui">
  <button id="bPrev" title="Slide anterior (←)" aria-label="Slide anterior">‹</button>
  <span id="count"></span>
  <button id="bNext" title="Próximo slide (→)" aria-label="Próximo slide">›</button>
  <button id="bFull" title="Tela cheia (F)" aria-label="Tela cheia">⛶</button>
</div>
<script>
(function(){
'use strict';
var R = window.RegrasBlack, P = R.P;
function fmt(n){ return Number(n).toLocaleString('pt-BR'); }
function sinal(n){ return (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n)); }
function col(n){ return Math.round(n * R.FATOR_COLMEIA); }
function li(a){ return '<ul>' + a.map(function(x){ return '<li>' + x + '</li>'; }).join('') + '</ul>'; }
function foot(t){ return '<div class="foot"><span>' + t + '</span><img class="vm" src="img/v-vulcabras.png" alt="Vulcabras"></div>'; }
function slide(eb, titulo, corpo, rod){ return '<section class="slide"><div class="eyebrow">' + eb + '</div><h2>' + titulo + '</h2>' + corpo + foot(rod) + '</section>'; }
var CORES = [['Vermelho','--t1'],['Azul','--t2'],['Verde','--t3'],['Amarelo','--t4'],['Rosa','--t5'],['Roxo','--t6']];
function chips(lista){ return '<div class="chips">' + lista.map(function(c){ return '<span class="chip" style="--c:var(' + c[1] + ')"><i></i>' + c[0] + '</span>'; }).join('') + '</div>'; }
var RODAPE = 'Missão Black Friday 2026 · 27, 28 e 29 de novembro';

var ex = [['Produtividade','2.200 peças',2200],['Assiduidade','9 de 10 presentes, 1 atraso',430],['Desafios','Grito da equipe',100],['Vistoria','1 caixa aberta no picking',-50],
  ['Meta do dia','bateu às 11h',200],['Meta antecipada','3 h antes do fim do T01',150],['Hora de ouro','450 peças na hora (meta 400)',450],['Destaques','top separador e top conferente',100]];
var exTot = ex.reduce(function(a, r){ return a + r[2]; }, 0);
function pct(n){ return Math.round(n / exTot * 100) + '%'; }

var S = [];
// capa
S.push('<section class="slide capa"><img class="logo" src="img/logo-vulcabras.png" alt="Vulcabras"><div class="eyebrow">Missão Black Friday 2026 · E-commerce</div>' +
  '<h1>Produtividade, pontuação e telão da Black</h1><div class="rule"></div>' +
  '<p class="sub">Como os times vão competir nos dias 27, 28 e 29 de novembro: regras, placar ao vivo e roteiro de atividades.</p>' +
  '<div class="tag">Apresentação à liderança · 05/11/2026</div><div class="big">BLACK</div></section>');

// campanha
S.push(slide('A campanha', 'Três dias para <em>mobilizar o CD inteiro</em>',
  '<div class="cards">' +
    '<div class="card gold"><div class="k">Período</div><div class="v">3 dias</div><div class="d">27, 28 e 29/11 · Largada Black, Superação e Grande Final</div></div>' +
    '<div class="card"><div class="k">Times</div><div class="v">6 cores</div><div class="d">um por piso em cada turno · 4 no piso e 2 na colmeia</div></div>' +
    '<div class="card"><div class="k">Pontuação</div><div class="v">1/peça</div><div class="d">mais blocos de presença, desafios, vistoria e bônus</div></div>' +
    '<div class="card green"><div class="k">Placar</div><div class="v">60 s</div><div class="d">telão atualizado direto do WMS, sem planilha</div></div>' +
  '</div><p class="lead">Produtividade e presença decidem o campeão; <b>desafios, vistoria e bônus</b> mantêm a disputa viva até o fim de cada turno.</p>',
  RODAPE));

// times e turnos
S.push(slide('A campanha', 'Um time de cada cor, <em>por piso e por turno</em>',
  '<div class="two"><div class="stack">' +
    Object.keys(R.TURNOS).map(function(k){ var t = R.TURNOS[k].rot.split(' · '); return '<div class="pill"><span>' + t[0] + (k === 'ADM' ? ' · a validar' : '') + '</span><b>' + t[1] + '</b></div>'; }).join('') +
  '</div><div class="stack">' +
    '<div class="lev"><div class="n">4</div><div><h3>Times no piso</h3><p>2 conferentes + separadores por time. <b>Piso disputa com piso.</b></p><div style="margin-top:16px">' + chips(CORES.slice(0,4)) + '</div></div></div>' +
    '<div class="lev"><div class="n">2</div><div><h3>Times na colmeia</h3><p>Mesma divisão, com 2 líderes. Meta e pontos fixos proporcionais <b>(×' + String(R.FATOR_COLMEIA).replace('.',',') + ')</b>.</p><div style="margin-top:16px">' + chips(CORES.slice(4)) + '</div></div></div>' +
  '</div></div>',
  'Escalação: planilha com uma aba por cor e a presença dos 3 dias na linha de cada pessoa · exporta, edita e reenvia no site'));

// calendário
S.push(slide('Roteiro de atividades', 'Antes, durante e depois da Black',
  '<div class="prem" style="grid-template-columns:repeat(5,1fr);gap:40px 36px">' +
    [['20/11 · sex','Pré-Black',['Entrega das camisetas','Apresentação da gamificação','Folha de regras nos pisos']],
     ['27/11 · sex','Largada Black',['Café de abertura','Fala do diretor e do gerente','Vídeo motivacional','Quiz relâmpago, grito da equipe e missão surpresa']],
     ['28/11 · sáb','Superação',['Apuração e premiação do 1º dia','Golden Ticket, desafio relâmpago e espírito de equipe','Pastel e refrigerante']],
     ['29/11 · dom','Grande Final',['Apuração e premiação do 2º dia','Quiz final, desafio surpresa e equipe mais engajada','Kit energia']],
     ['30/11 · seg','Encerramento',['Apuração do 3º dia','Time campeão da gincana','Fala do diretor e do gerente','Coffee de encerramento']]
    ].map(function(d){ return '<div><p class="dia">' + d[0] + '</p><h3>' + d[1] + '</h3>' + li(d[2]) + '</div>'; }).join('') +
  '</div>',
  'DJ nos quatro dias de evento · o placar roda o tempo todo; a apuração oficial de cada dia sai na manhã seguinte'));

// arquitetura
S.push(slide('Pontuação', 'Arquitetura de pontos <em>por time, por dia</em>',
  '<table class="cmp"><tr><th>Bloco</th><th style="text-align:left">Como conta</th><th>Piso</th><th>Colmeia</th></tr>' +
    [['Produtividade','cada peça separada ou conferida','1/peça','1/peça'],['Meta do dia','total ≥ meta (2.000 · 1.200)',sinal(P.metaBatida),sinal(col(P.metaBatida))],
     ['Meta antecipada','por hora antes do fim do turno',sinal(P.antecipadaHora)+' (máx. '+fmt(P.antecipadaMax)+')',sinal(col(P.antecipadaHora))+' (máx. '+fmt(col(P.antecipadaMax))+')'],
     ['Hora que vale ouro','peças da hora em dobro se bater a meta da hora','2×','2×'],['Assiduidade','máximo × presentes ÷ escalados','até '+fmt(P.assiduidadeMax),'até '+fmt(col(P.assiduidadeMax))],
     ['Desafios','3 por dia, '+fmt(R.PONTOS_DESAFIO)+' cada','até '+fmt(P.desafiosMax),'até '+fmt(col(P.desafiosMax))],['Vistoria','segurança, qualidade e 5S',sinal(P.vistoriaLimpa)+' / descontos',sinal(col(P.vistoriaLimpa))+' / descontos'],
     ['Destaques','top separador e top conferente do turno',sinal(P.destaque)+' cada',sinal(col(P.destaque))+' cada'],['Trinca Perfeita','100% de presença nos 3 dias',sinal(P.trincaPerfeita),sinal(col(P.trincaPerfeita))]
    ].map(function(r){ return '<tr><td><b>'+r[0]+'</b></td><td style="text-align:left;color:var(--muted)">'+r[1]+'</td><td class="hl">'+r[2]+'</td><td>'+r[3]+'</td></tr>'; }).join('') +
  '</table>',
  'Colmeia: pontos fixos ×' + String(R.FATOR_COLMEIA).replace('.',',') + ', proporcional à meta · todos os valores saem do mesmo arquivo de regras do telão'));

// por que 1 ponto por peça
S.push(slide('Pontuação', 'Cada peça vale 1 ponto: <em>nada do esforço é jogado fora</em>',
  '<div class="grid2">' +
    '<div class="lev"><div class="n">A</div><div><h3>Proposta inicial</h3><p>Produtividade 500 · Assiduidade 300 · Desafios 150 · Seg./Qual. 50. Teto de 1.000 por dia: quem faz 2.000 ou 2.600 peças recebe o mesmo máximo.</p></div></div>' +
    '<div class="lev"><div class="n">B</div><div><h3>Proposta ajustada</h3><p><b>1 ponto por peça</b> + blocos fixos dimensionados pela meta, para pesar diante de ~2.000 peças por dia.</p></div></div>' +
  '</div><div class="cards">' +
    '<div class="card gold"><div class="k">Produtividade</div><div class="v">' + pct(2200) + '</div></div>' +
    '<div class="card"><div class="k">Presença</div><div class="v">' + pct(430) + '</div></div>' +
    '<div class="card"><div class="k">Bônus</div><div class="v">' + pct(900) + '</div></div>' +
    '<div class="card"><div class="k">Desafios + vistoria</div><div class="v">' + pct(50) + '</div></div>' +
  '</div>',
  'Participação no total do dia de exemplo (time Vermelho, ' + fmt(exTot) + ' pts) · produtividade + presença = ' + pct(2630) + ', como na proposta da gerência'));

// assiduidade
S.push(slide('Pontuação', 'Assiduidade <em>linear</em>: cada falta custa só a parte daquela pessoa',
  '<div class="cards">' +
    '<div class="card red"><div class="k">Por faixas · 10 pessoas, 1 falta</div><div class="v">0 pts</div><div class="d">90% de presença. Faixas de 94% a 99,99% só existem em times com mais de 17 pessoas: vira tudo ou nada.</div></div>' +
    '<div class="card green"><div class="k">Linear · 10 pessoas, 1 falta</div><div class="v">' + fmt(P.assiduidadeMax * 0.9) + ' pts</div><div class="d">Máximo (' + fmt(P.assiduidadeMax) + ') × presentes ÷ escalados. Atestado conta como falta; atraso ' + sinal(P.atraso) + '.</div></div>' +
    '<div class="card gold"><div class="k">Trinca Perfeita</div><div class="v">' + sinal(P.trincaPerfeita) + '</div><div class="d">Time com 100% de presença nos 3 dias, somado no placar final.</div></div>' +
  '</div>',
  'Escalados = pessoas do time na planilha do dia · presença lançada na mesma planilha da escalação (P, F ou A por dia)'));

// desafios
S.push(slide('Desafios e gincanas', 'Três desafios por dia, <em>' + fmt(R.PONTOS_DESAFIO) + ' pontos cada</em>',
  '<div class="prem" style="grid-template-columns:repeat(3,1fr)">' +
    R.DIAS.map(function(d){ return '<div><p class="dia">' + d[1] + '</p><h3>' + d[2] + '</h3>' + li(R.DESAFIOS[d[0]] || []) + '</div>'; }).join('') +
  '</div><div class="lev"><div class="n">+</div><div><h3>Banco de gincanas entre pisos</h3><p>Acerte o alvo · Corrida do palete · Montagem relâmpago · Quebra-cabeça da Black · Quem canta ganha · Corrida de entregas · Desafio dos líderes · TikTok dos líderes · Grito de guerra do piso. <b>Prêmio do dia para o piso vencedor:</b> energético, picolé, refrigerante ou chocolate.</p></div></div>',
  'Desafios lançados no sistema por admin, com horário e quem lançou · até ' + fmt(P.desafiosMax) + ' pts por dia no piso, ' + fmt(col(P.desafiosMax)) + ' na colmeia'));

// bônus
S.push(slide('Bônus', 'Bater a meta cedo e <em>a hora que vale ouro</em>',
  '<div class="cards">' +
    '<div class="card gold"><div class="k">Meta do dia</div><div class="v">' + sinal(P.metaBatida) + '</div><div class="d">quando o total do time passa da meta (2.000 piso · 1.200 colmeia)</div></div>' +
    '<div class="card gold"><div class="k">Meta antecipada</div><div class="v">' + sinal(P.antecipadaHora) + '</div><div class="d">por hora inteira antes do fim do turno · máximo ' + fmt(P.antecipadaMax) + '</div></div>' +
    '<div class="card gold"><div class="k">Hora que vale ouro</div><div class="v">2×</div><div class="d">agendada em segredo; quem bater a meta da hora tem as peças dela em dobro</div></div>' +
    '<div class="card gold"><div class="k">Destaques</div><div class="v">' + sinal(P.destaque) + '</div><div class="d">ao time do top separador e do top conferente de cada turno</div></div>' +
  '</div><p class="lead">Na hora de ouro o telão mostra uma <b>faixa dourada com contagem regressiva</b> e a meta da hora.</p>',
  'Bônus calculados automaticamente a partir dos relatórios do WMS'));

// vistoria
S.push(slide('Vistoria', 'Segurança, qualidade e 5S <em>no estilo autoescola</em>',
  '<div class="cards">' +
    Object.keys(R.GRAVIDADES).map(function(g){ var its = R.CHECKLIST.filter(function(c){ return c.grav === g; }); return '<div class="card red"><div class="k">' + R.GRAVIDADES[g].rot + '</div><div class="v">' + sinal(R.GRAVIDADES[g].pts) + '</div>' + li(its.map(function(c){ return c.item; })) + '</div>'; }).join('') +
  '</div><p class="lead">Vistoria em horário aleatório, por piso e time. O vistoriador marca o checklist e <b>o desconto entra no placar na hora</b>. Vistoria sem apontamento vale ' + sinal(P.vistoriaLimpa) + '.</p>',
  'Cada item gravado com motivo, piso, time, horário e quem lançou'));

// exemplo
S.push(slide('Exemplo', 'Um dia do time Vermelho: <em>' + fmt(exTot) + ' pontos</em>',
  '<table class="cmp"><tr><th>Bloco</th><th style="text-align:left">O que aconteceu</th><th>Pontos</th></tr>' +
    ex.map(function(r){ return '<tr><td>' + r[0] + '</td><td style="text-align:left;color:var(--muted)">' + r[1] + '</td><td' + (r[2] < 0 ? ' class="neg"' : '') + '>' + sinal(r[2]) + '</td></tr>'; }).join('') +
    '<tr class="tot"><td>Total do dia</td><td style="text-align:left">Time Vermelho · T01</td><td class="hl">' + fmt(exTot) + '</td></tr></table>',
  'Exemplo ilustrativo com os valores do regulamento · conferido à mão contra o cálculo do telão'));

// telão
S.push(slide('Telão e sistema', 'O que roda no telão de 75"',
  '<div class="grid2">' +
    '<div class="shot"><img src="img/tela-a-corrida.png" alt="Corrida Maluca"><span>Corrida Maluca: times do turno, comemoração quando bate a meta</span></div>' +
    '<div class="shot"><img src="img/tela-p-placar.png" alt="Placar da Black"><span>Placar da Black: todos os blocos de pontos, por time</span></div>' +
  '</div>' + chips([['A · Corrida Maluca','--t4'],['B · Separação e Conferência','--t2'],['C · Operação agora','--t3'],['D · Armazenagem','--t6'],['P · Placar','--t1'],['Faixa da hora de ouro','--t4']]),
  'Telas em rodízio · dados do WMS a cada 5–10 minutos · telão atualiza a cada 60 s'));

// operação agora
S.push(slide('Telão e sistema', 'Operação agora: <em>o backlog em itens, ao vivo</em>',
  '<div class="shot"><img src="img/tela-c-operacao.png" alt="Operação agora" style="max-height:640px"><span>Itens por etapa, pedido mais antigo em tela e itens por marca</span></div>',
  'Fonte: Acompanhamento Saída por Nota Fiscal + Itens de NF de Saída (WMS)'));

// fluxo
S.push(slide('Auditoria', 'De onde vem cada ponto, <em>e quem lançou</em>',
  '<div class="grid2">' +
    [['Robô baixa do WMS','Separação, Conferência, Colmeia, Kardex, Acompanhamento OP e Itens de NF, a cada 5–10 min.'],
     ['Banco calcula','As mesmas regras do site: produtividade por pessoa e por time, operação em itens.'],
     ['Lançamentos manuais','Vistoria, desafios e ajustes só por admin, com horário, motivo e quem lançou.'],
     ['Telão mostra','Atualiza a cada 60 s: corrida, placar, comemoração e hora de ouro.']
    ].map(function(x, i){ return '<div class="lev"><div class="n">' + (i + 1) + '</div><div><h3>' + x[0] + '</h3><p>' + x[1] + '</p></div></div>'; }).join('') +
  '</div><p class="lead"><b>Nenhum ponto é apagado.</b> Correção é estorno, que também fica registrado: qualquer questionamento tem resposta com data, hora e responsável.</p>',
  'Contestação com o líder até o início do turno seguinte'));

// folha de regras
S.push(slide('Comunicação', 'Folha de regras <em>colada nos pisos</em>',
  '<div class="two" style="grid-template-columns:560px 1fr">' +
    '<div class="shot"><img src="img/folha-pisos.png" alt="Folha de regras" style="max-height:620px;width:auto;max-width:100%"></div>' +
    '<div class="stack">' +
      '<div class="lev"><div class="n">+</div><div><h3>"Se eu fizer isso, meu time ganha"</h3><p>Cada linha com o valor exato, igual ao sistema.</p></div></div>' +
      '<div class="lev"><div class="n">−</div><div><h3>"Se eu não seguir isso, meu time perde"</h3><p>Faltas, atrasos e o checklist da vistoria por gravidade.</p></div></div>' +

    '</div></div>',

// premiação
S.push(slide('Reconhecimento', 'Premiação',
  '<div class="prem" style="grid-template-columns:repeat(3,1fr)">' +
    '<div><h3>Campeão Black Friday</h3><p>Maior pontuação acumulada nos três dias, piso e colmeia, por turno.</p></div>' +

    '<div><h3>Time 100%</h3><p>Trinca Perfeita: 100% de presença nos 3 dias.</p></div>' +
    '<div><h3>Destaque do turno</h3><p>Top separador e top conferente de cada dia, com nome no telão.</p></div>' +
    '<div><h3>Vistoria nota 10</h3><p>Time com mais vistorias sem apontamento.</p></div>' +

// próximos passos
S.push(slide('Próximos passos', 'O que precisamos <em>da liderança</em>',
  '<div class="grid2">' +
    '<div class="lev"><div class="n">1</div><div><h3>Decisões</h3>' + li(['Aprovar os pesos da pontuação','Metas oficiais por time (hoje provisórias: 2.000 piso · 1.200 colmeia)','Confirmar turno ADM e T03']) + '</div></div>' +
    '<div class="lev"><div class="n">2</div><div><h3>Preparação</h3>' + li(['Escalação dos times com presença (planilha por cor)','Definir vistoriadores e agenda das horas de ouro','Teste no telão de 75" e ensaio no dia anterior','Imprimir e colar a folha de regras nos pisos']) + '</div></div>' +
  '</div>',
  RODAPE));

document.getElementById('stage').innerHTML = S.join('');
})();
</script>
<script>
const S=[...document.querySelectorAll('.slide')], st=document.getElementById('stage');
let i=0;
function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);st.style.transform='translate(-50%,-50%) scale('+k+')';}
function show(n){i=Math.max(0,Math.min(S.length-1,n));S.forEach((s,j)=>{s.classList.toggle('on',j===i);s.classList.toggle('prev',j<i);});
 document.getElementById('count').textContent=(i+1)+' / '+S.length;document.getElementById('bar').style.width=((i+1)/S.length*100)+'%';
 try{history.replaceState(null,'','#'+(i+1));}catch(e){}}
function full(){const d=document,el=d.documentElement;
 if(!(d.fullscreenElement||d.webkitFullscreenElement)){const r=(el.requestFullscreen||el.webkitRequestFullscreen);if(r){const p=r.call(el);if(p&&p.catch)p.catch(()=>{});}}
 else (d.exitFullscreen||d.webkitExitFullscreen).call(d);}
document.getElementById('bPrev').onclick=()=>show(i-1);
document.getElementById('bNext').onclick=()=>show(i+1);
document.getElementById('bFull').onclick=full;
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();show(i+1);}
 else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();show(i-1);}
 else if(e.key==='f'||e.key==='F')full(); else if(e.key==='Home')show(0); else if(e.key==='End')show(S.length-1);});
let tx=null;addEventListener('touchstart',e=>tx=e.touches[0].clientX);addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)show(i+(dx<0?1:-1));tx=null;});
let tm;addEventListener('mousemove',()=>{document.body.classList.add('mouse');clearTimeout(tm);tm=setTimeout(()=>document.body.classList.remove('mouse'),2000);});
addEventListener('resize',fit);fit();show((parseInt(location.hash.slice(1))||1)-1);
</script>
</body></html>
